<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Signal Line</title>
<meta name="description" content="Build telegraph networks that meet a latency, throughput and budget contract.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Line">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:dark;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#141d2b}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one-screen app. A hand-tinted survey map sits in dusk-blue chrome; three contract meters above it are the score. */
:root{
  color-scheme:dark;
  --ink:#141d2b; --panel:#1d2939; --panel2:#283649; --line:#3b4d66;
  --paper:#efe7d2; --muted:#a3b3c8;
  --sun:#f2b545; --dusk:#d0607f; --good:#86cf96; --warn:#ff9db5;
  --display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --ui:"Barlow","Helvetica Neue",Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font:15px/1.45 var(--ui);overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;position:relative;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.btn{min-height:46px;padding:0 18px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  font:600 15px var(--cond);letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#2a1d05}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* ---------- menu ---------- */
#menu{overflow-y:auto;-webkit-overflow-scrolling:touch}
.menu-in{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:14px 30px}
.masthead{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.mast-sem{width:104px;height:112px;flex:none;color:var(--sun)}
.mast-sem svg{width:100%;height:100%}
h1{font:700 clamp(38px,7vw,68px)/.95 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--sun)}
.lede{margin:10px 0 0;color:var(--muted);font-size:17px;max-width:48ch}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:8px 12px;text-align:left;min-width:0}
.mode b{display:block;font:600 16px var(--cond);letter-spacing:.05em;text-transform:uppercase}
.mode span{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.mode[aria-checked="true"]{border-color:var(--sun);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--sun)}
.mode[aria-checked="true"] b{color:var(--sun)}
#eras{display:flex;flex-direction:column;gap:22px}
h2{font:500 26px var(--display);margin:6px 0 -8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font:600 13px var(--cond);letter-spacing:.12em;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lv{min-height:92px;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;text-align:left;
  display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;min-width:0}
.lv i{font:italic 500 34px/1 var(--display);color:var(--sun);grid-row:span 2}
.lv b{font:600 15px/1.15 var(--cond);letter-spacing:.03em}
.lv .st{font-size:15px;letter-spacing:2px;color:var(--sun)}
.lv .st s{text-decoration:none;color:var(--line)}
.lv .st u{text-decoration:none;font:600 11px var(--cond);letter-spacing:.08em;color:var(--muted);margin-left:6px;text-transform:uppercase}
.lv[disabled]{opacity:.4}
.lv[disabled] i{color:var(--muted)}
.lv.add{border-style:dashed}
.cl{display:flex;flex-direction:column;gap:6px;min-width:0}
.btn.mini{min-height:44px;font-size:13px}
.menu-foot{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- game ---------- */
#game{display:flex;flex-direction:column;gap:8px}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 14px;align-items:center}
.hud h3{margin:0;font:500 22px/1 var(--display);white-space:nowrap}
.hud h3 small{display:block;font:600 11px var(--cond);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.hud-l,.hud-r{display:flex;gap:8px;align-items:center}
.icon{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font:600 18px var(--cond)}
.meters{min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 14px}
.meter{min-width:0;display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:0 8px}
.meter small{font:600 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.meter b{font:600 15px var(--cond);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter i{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--panel2);display:block;margin-top:3px}
.meter u{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--sun);max-width:100%}
.meter.ok u{background:var(--good)}
.meter.bad u{background:var(--dusk)}
.meter.bad b{color:var(--warn)}
.meter s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--paper);opacity:.85}
.err{color:var(--warn)}
/* dispatch slip: the game's voice, styled as a telegram form */
.dispatch{--tone:#3b4d66;position:absolute;z-index:4;top:10px;left:10px;right:10px;margin:0 auto;max-width:820px;
  display:flex;align-items:center;gap:14px;min-height:58px;padding:8px 40px 8px 10px;border-radius:12px;
  background:var(--paper);color:var(--ink);border-left:8px solid var(--tone);box-shadow:0 4px 0 rgba(0,0,0,.25);
  background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(20,29,43,.06) 23px 24px)}
.dispatch[data-tone="bad"]{--tone:#c2456a}.dispatch[data-tone="warn"]{--tone:#d9961e}.dispatch[data-tone="good"]{--tone:#3f9a5a}
.stamp{flex:none;width:40px;height:40px;border-radius:50%;background:var(--tone);color:#fff;display:flex;align-items:center;justify-content:center;
  font:700 22px/1 var(--cond);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.dtext{min-width:0;display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
.dtext b.h{font:700 22px/1.1 var(--display);white-space:nowrap;color:var(--tone)}
.dtext span{font:500 16px/1.35 var(--ui);color:#2a3446}
.dtext span b{font-weight:700;color:var(--ink)}
.dtext .w{color:#b23a5c;font-weight:600}.dtext .g{color:#b07c12;letter-spacing:2px}
.dispatch.pop{animation:slip .35s ease-out}
.dispatch{pointer-events:none;transition:opacity .15s}.dispatch.dim{opacity:.15}
.dispatch .dx{pointer-events:auto;position:absolute;top:2px;right:2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font:600 24px/1 var(--cond);color:#7a8496;border-radius:10px}
.btn[aria-disabled="true"]{opacity:.5}
@keyframes slip{0%{transform:translateY(-6px);opacity:.3}100%{transform:none;opacity:1}}
/* piece cards */
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tcard{border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:6px 10px 7px;text-align:left;
  display:flex;flex-direction:column;gap:3px;color:var(--paper);min-width:0}
.tcard .nm{display:flex;align-items:center;gap:6px;font:600 14px var(--cond);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tcard .nm svg{width:18px;height:24px;flex:none}
.tcard .nm em{font-style:normal;color:var(--sun);letter-spacing:.02em;margin-left:auto;padding-left:8px}
.tcard dl{margin:0;display:grid;grid-template-columns:auto auto;gap:1px 12px}
.tcard dd{margin:0;font:500 12px/1.3 var(--cond);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.tcard dd b{font:600 14px var(--cond);color:var(--paper);font-variant-numeric:tabular-nums;margin-right:3px}
.tcard[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);box-shadow:0 0 0 2px var(--sun)}
.tcard[aria-pressed="true"] dd{color:#5a6577}.tcard[aria-pressed="true"] dd b{color:var(--ink)}.tcard[aria-pressed="true"] .nm em{color:#9a6a0c}
.iconbtn{width:50px;min-height:36px;padding:0;font-size:18px}
.stack{display:flex;flex-direction:column;gap:4px}
#toolbar{gap:6px}
.mapwrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#map{border-radius:10px;touch-action:none;display:block;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.35)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .sp{flex:1}
#send{min-width:120px;min-height:58px;font-size:17px}
.brushes{display:flex;gap:6px;flex-wrap:wrap}
.brush{padding:0 10px;font-size:13px;gap:6px}
.brush i{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.35);flex:none}

/* decode */
.decode{position:absolute;left:0;right:0;bottom:0;background:rgba(20,29,43,.95);border:1px solid var(--line);border-radius:14px;
  padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;backdrop-filter:blur(6px)}
.sig{width:150px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sigbox{width:150px;height:130px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--paper)}
.sigbox svg{width:120px;height:120px}
.sigbox.pop svg,.sigbox.pop .tape{animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.lamp{width:34px;height:34px;border-radius:50%;background:#3a3222;border:2px solid var(--line);margin-bottom:10px}
.lamp.on{background:var(--sun);box-shadow:0 0 18px var(--sun)}
.tapewrap{display:flex;flex-direction:column;align-items:center}
.tape{display:flex;gap:6px;align-items:center;min-height:14px}
.tape i,.k .mc i{display:inline-block;background:currentColor;border-radius:99px}
.tape i.dot{width:13px;height:13px}.tape i.dash{width:34px;height:13px}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.slots span{width:32px;height:38px;border-bottom:3px solid var(--line);font:700 26px/36px var(--display);text-align:center}
.slots span.cur{border-color:var(--sun)}
.slots em{font:500 13px var(--cond);font-style:normal;color:var(--muted);margin-left:8px}
.dtimer{height:6px;border-radius:3px;background:var(--panel2);margin-bottom:8px;overflow:hidden}
.dtimer u{display:block;height:100%;width:100%;background:var(--sun)}
.keys{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.k{min-height:66px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font:600 17px var(--cond);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0;min-width:0;color:var(--paper)}
.k svg{width:42px;height:42px;color:var(--sun)}
.k .mc{display:flex;gap:2px;height:8px;align-items:center;color:var(--sun)}
.k .mc i.dot{width:5px;height:5px}.k .mc i.dash{width:11px;height:5px}
.k.bad{animation:shake .3s;background:var(--dusk)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* overlay */
#overlay{position:absolute;inset:0;background:rgba(10,14,22,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:600px;width:100%;max-height:100%;overflow-y:auto;
  display:flex;flex-direction:column;gap:12px}
.card.wide{max-width:860px}
.card h4{font:700 32px/1.05 var(--display);margin:0;text-wrap:balance}
.card h4 small{display:block;font:600 12px var(--cond);letter-spacing:.14em;color:var(--sun);text-transform:uppercase;margin-bottom:6px}
.card p{margin:0;color:var(--paper);max-width:62ch}
.card p.m{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.facts div{background:var(--panel2);border-radius:10px;padding:8px 10px;font:600 17px var(--cond);font-variant-numeric:tabular-nums}
.facts small{display:block;font:600 11px var(--cond);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.new{display:flex;flex-direction:column;gap:8px}
.new h5{margin:4px 0 0;font:600 12px var(--cond);letter-spacing:.14em;color:var(--sun);text-transform:uppercase}
.ni{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ni i{width:26px;height:26px;border-radius:7px;margin-top:2px;border:1px solid rgba(255,255,255,.25)}
.ni b{display:block;font:600 16px var(--cond);letter-spacing:.03em}
.ni span{color:var(--muted);font-size:14px;line-height:1.4}
.stars{font-size:44px;letter-spacing:8px;color:var(--sun);line-height:1}
.stars s{text-decoration:none;color:var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--paper)}
.rules b{color:var(--sun);font-weight:600}
.book{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.book .k{cursor:default}
.book .k .mc{height:12px;gap:3px}.book .k .mc i.dot{width:7px;height:7px}.book .k .mc i.dash{width:16px;height:7px}
.tabs{display:flex;gap:8px}
input,select,textarea{font:400 16px var(--ui);color:var(--paper);background:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:10px;min-height:46px;width:100%;-webkit-user-select:text;user-select:text}
textarea{min-height:110px;resize:vertical;line-height:1.4}
textarea.code{font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;min-height:220px;white-space:pre}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form label,.form .fld{display:flex;flex-direction:column;gap:4px;font:600 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
.step{display:flex;align-items:center;gap:8px}
.step .icon{flex:none}
.step b{font:600 20px var(--cond);color:var(--paper);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}

@media (max-width:720px){
  .hud{grid-template-columns:1fr auto}
  .meters{grid-column:1/-1;grid-row:2;gap:3px 8px}
  .dtext b.h{font-size:18px}.dtext span{font-size:14px}.dispatch{min-height:50px}.stamp{width:32px;height:32px;font-size:18px}
  .tcard{padding:4px 8px}.tcard dl{gap:0 8px}.tcard dd{font-size:11px}.tcard dd b{font-size:12px}
  .meter{grid-template-columns:1fr}.meter b{text-align:left;font-size:13px}.meter small{font-size:10px}
  .hud-l{min-width:0}.hud h3{overflow:hidden;text-overflow:ellipsis}
  .hud-r .btn{padding:0 10px;font-size:13px}
  .modes{grid-template-columns:1fr}
  .decode{grid-template-columns:1fr;gap:8px;padding:8px}
  .sig{width:auto;flex-direction:row}.sigbox{width:96px;height:84px}.sigbox svg{width:78px;height:78px}
  .k{min-height:44px;font-size:14px}.k svg{width:24px;height:24px}
  .book{grid-template-columns:repeat(6,minmax(0,1fr))}
  #send{min-width:110px}
  .form{grid-template-columns:1fr}
  .brush{padding:0 8px;min-height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="app">
  <section id="menu" class="screen">
    <div class="menu-in">
      <header class="masthead">
        <div class="mast-sem" id="heroSem" aria-hidden="true"></div>
        <div>
          <h1>Signal <em>Line</em></h1>
          <p class="lede">Build the line across hill, forest, river and marsh. Every contract asks three things: fast enough, busy enough, inside the budget.</p>
        </div>
      </header>
      <div class="modes" role="radiogroup" aria-label="Difficulty" id="modes">
        <button class="mode" role="radio" data-mode="engineer"><b>Engineer</b><span>Build the network. The messages read themselves.</span></button>
        <button class="mode" role="radio" data-mode="operator"><b>Operator</b><span>Decode a message on the finished line, code chart on the keys.</span></button>
        <button class="mode" role="radio" data-mode="expert"><b>Expert</b><span>Decode from memory. No chart.</span></button>
      </div>
      <div id="eras"></div>
      <h2>Your Levels <small>EDITOR · JSON IMPORT AND EXPORT</small></h2>
      <div class="levels" id="lv3"></div>
      <div class="menu-foot">
        <button class="btn" data-act="book">Code book</button>
        <button class="btn" data-act="rules">Rules</button>
        <button class="btn" data-act="settings">Settings</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="hud">
      <div class="hud-l">
        <button class="icon" data-act="menu" aria-label="Back">&#8249;</button>
        <h3 id="lvTitle"></h3>
      </div>
      <div class="meters" id="meters">
        <div class="meter" id="mLat"><small>Latency</small><b></b><i><u></u></i></div>
        <div class="meter" id="mRate"><small>Messages a minute</small><b></b><i><u></u></i></div>
        <div class="meter" id="mCost"><small>Budget</small><b></b><i><u></u><s id="tk3"></s><s id="tk2"></s></i></div>
      </div>
      <div class="hud-r">
        <button class="icon pl" data-act="book" aria-label="Code book">A&#183;</button>
        <button class="icon pl" data-act="rules" aria-label="Rules">?</button>
        <button class="btn ed" data-act="edSettings" hidden>Settings</button>
        <button class="btn ed" data-act="edExport" hidden>Export</button>
        <button class="btn primary ed" data-act="edTest" id="edTest" hidden>Test</button>
      </div>
    </div>
    <div class="mapwrap" id="mapwrap">
    <div class="dispatch" id="dispatch" data-tone="info" hidden role="status" aria-live="polite"><span class="stamp" id="dStamp">&rarr;</span><div class="dtext"><b class="h" id="dHead"></b><span id="status"></span></div><button class="dx" data-act="dismiss" aria-label="Dismiss message">&times;</button></div>
      <canvas id="map"></canvas>
      <div class="decode" id="decode" hidden>
        <div class="sig"><div class="sigbox" id="sigbox"></div><button class="btn" id="replay" data-act="replay" hidden>Replay</button></div>
        <div><div class="slots" id="slots"></div><div class="dtimer" id="dtimer" hidden><u></u></div><div class="keys" id="keys"></div></div>
      </div>
    </div>
    <div class="toolbar" id="toolbar">
      <div class="tools" id="tools"></div>
      <div class="stack"><button class="btn ghost iconbtn" data-act="undo" id="undo" aria-label="Undo">&#8630;</button>
      <button class="btn ghost iconbtn" data-act="clear" id="clear" aria-label="Clear all">&#10005;</button></div>
      <button class="btn ghost" data-act="solution" id="solBtn" hidden>Solve</button>
      <span class="sp"></span>
      <button class="btn primary" data-act="send" id="send">Send</button>
    </div>
    <div class="toolbar" id="edbar" hidden>
      <div class="brushes" id="brushes"></div>
      <span class="sp"></span>
      <button class="btn ghost" data-act="edBest" id="edBest">Best network</button>
      <button class="btn ghost" data-act="edUndo" id="edUndo">Undo</button>
    </div>
  </section>

  <div id="overlay" hidden><div class="card" id="card"></div></div>
</div>

<script id="core">

  contract:['#f2b545','The contract','Every line has three targets: carry enough messages a minute, deliver each one inside the latency limit, and stay within budget. Latency is the time a message takes: every piece it passes through adds the delay shown on that piece\u2019s card. The three meters at the top update as you build, and Send unlocks when all three are met.'],

function edPaint(e){ var c=cellAt(e), l=E.last||c, n=Math.max(Math.abs(c.x-l.x),Math.abs(c.y-l.y)), ch=false, st='ABCD'.indexOf(E.brush)>=0;
  for(var i=(E.last&&!st?1:n);i<=n;i++){ var u=n?i/n:1; if(edCell({x:Math.round(l.x+(c.x-l.x)*u),y:Math.round(l.y+(c.y-l.y)*u)})) ch=true; }

  E.last=c; if(ch) edChanged(); }
function edCell(c){ if(c.x<0||c.y<0||c.x>=E.w||c.y>=E.h) return false; var b=E.brush;
  var here=townAt(c.x,c.y), onS=here==='A', onE=here==='B';
  if('ABCD'.indexOf(b)>=0){ if(here) return false; if(b==='D'&&!E.extra.C) b='C'; if(E.snap){ edPush(E.snap); E.snap=null; }
    if(b==='A'||b==='B'){ var me=b==='A'?E.start:E.end; me.x=c.x; me.y=c.y; } else E.extra[b]={x:c.x,y:c.y};
    if(E.grid[c.y][c.x]!=='h') E.grid[c.y][c.x]='.'; }

    if((here==='C'||here==='D')&&b!=='.'&&b!=='h'){ if(E.snap){ edPush(E.snap); E.snap=null; } E.extra[here]=null; if(here==='C'&&E.extra.D){ E.extra.C=E.extra.D; E.extra.D=null; } } if(E.grid[c.y][c.x]===b) return false; if(E.snap){ edPush(E.snap); E.snap=null; } E.grid[c.y][c.x]=b; }

document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||b.disabled) return; ac();
  if(b.dataset.mode){ S.mode=b.dataset.mode; save(); renderMenu(); return; }
  if(b.dataset.level!==undefined){ startLevel(+b.dataset.level); return; }
  if(b.dataset.custom){ var en=findCustom(b.dataset.custom); if(en&&!startLevel(-1,null,en.def,null,en.id)) card('<h4><small>Your level</small>No network meets this contract</h4><p>Open the level in the editor to fix the map or the contract.</p><div class="acts"><button class="btn primary" data-edit="'+en.id+'">Edit</button><button class="btn ghost" data-act="close">Close</button></div>'); return; }
  if(b.dataset.edit){ E=null; openEditor(b.dataset.edit); return; }
  if(b.dataset.brush){ E.brush=b.dataset.brush; edBrushes(); return; }
  if(b.dataset.size){ edResize(E.w+(b.dataset.size==='w+'?1:b.dataset.size==='w-'?-1:0),E.h+(b.dataset.size==='h+'?1:b.dataset.size==='h-'?-1:0)); $('#szW').textContent=E.w; $('#szH').textContent=E.h; return; }
  if(b.dataset.tool){ setTool(b.dataset.tool); updateHud(); return; }
  if(b.dataset.key){ keyPress(b); return; }
  if(b.dataset.play){ if($('#card h4').textContent.indexOf('Morse')>=0) playMorse(b.dataset.play,wpmFor(G&&G.def)); return; }
  switch(b.dataset.act){
    case 'menu': cardStack=null; if(G&&G.origin==='editor'&&E){ openEditor(E.id); } else { if(G&&G.phase==='edit'){ clearTimeout(edTimer); edPersist(); } E=null; openMenu(); } break;
    case 'begin': $('#overlay').hidden=true; G.phase='plan'; setPhaseUI(); MSG.key=''; updateHud(); showMsg(6000); break;
    case 'dismiss': hideMsg(); break;
    case 'send': if(G&&G.phase==='plan'&&!contractOk()){ sfx.bad(); showMsg(9000); } else send(); break;
    case 'undo': if(G&&G.phase==='plan'&&G.history.length){ var hs=JSON.parse(G.history.pop()); G.structs=hs.s; G.cables=hs.c; sfx.remove(); replan(); } break;
    case 'clear': if(G.structs.length){ G.history.push(snapshot()); G.structs=[]; G.cables=[]; sfx.remove(); replan(); } break;
    case 'retry': cardStack=null; startLevel(G.idx,null,G.cdef,G.origin,G.cid); break;
    case 'next': cardStack=null; startLevel(G.idx+1); break;
    case 'rules': showRules(); break;
    case 'book': showBook(); break;
    case 'book1': showBook(1); break;
    case 'book2': showBook(2); break;
    case 'close': closeCard(); break;
    case 'settings': showSettings(); break;
    case 'tryMorse': 'SOS'.split('').forEach(function(c,i){ setTimeout(function(){ playMorse(c,S.wpm||10); },i*(1.2/(S.wpm||10))*14*1000); }); break;
    case 'replay': if(G&&G.phase==='decode') playMorse(G.word[G.dec.i],wpmFor(G.def)); break;
    case 'testing': S.testing=!S.testing; save(); b.textContent=S.testing?'Testing on':'Testing off'; b.setAttribute('aria-pressed',S.testing); renderMenu(); break;
    case 'solution': showSolution(); break;
    case 'sound': S.sound=!S.sound; save(); b.textContent=S.sound?'Sound on':'Sound off'; if(S.sound) sfx.place(); break;
    case 'newLevel': showNew(); break;
    case 'newCreate': createLevel($('#newTpl').value); break;
    case 'impOpen': showImport(); break;
    case 'impGo': doImport($('#impText').value); break;
    case 'edSettings': showEdSettings(); break;
    case 'edApply': edApplySettings(); break;
    case 'edExport': showExport(); break;
    case 'edSave': edSaveFile(); break;
    case 'edCopy': edCopy(); break;
    case 'edTest': clearTimeout(edTimer); edSolve(); if(isFinite(E.par)) startLevel(-1,null,JSON.parse(JSON.stringify(E.def)),'editor',null); break;
    case 'edBest': E.showBest=!E.showBest; edBrushes(); edSolve(); break;
    case 'edUndo': edUndo(); break;
    case 'edDelete': if(b.dataset.armed){ S.custom=S.custom.filter(function(x){return x.id!==E.id;}); delete S.cprog[E.id]; save(); E=null; openMenu(); } else { b.dataset.armed='1'; b.textContent='Tap again to delete'; } break;
  }

    if(G.dirty||G.sim||(G.diag&&G.phase==='plan')){ G.dirty=false; draw(); } }
  requestAnimationFrame(loop); })();

function boot(data){ renderMenu(); heroTick();
  if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)) setInterval(function(){ if(!$('#menu').hidden) heroTick(); },1300);
  if(data&&data.edit&&findCustom(data.edit)){ openEditor(data.edit); return; }
  if(data&&typeof data.idx==='number'&&LEVELS[data.idx]){ startLevel(data.idx,{structs:data.structs||[],cables:data.cables||[]}); $('#overlay').hidden=true; G.phase='plan'; setPhaseUI(); updateHud(); } }
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(function(){ return G&&G.phase==='edit'&&E?{edit:E.id}:G&&G.idx>=0?{idx:G.idx,structs:G.structs,cables:G.cables}:{}; });
if(hot&&hot.ready) hot.ready(boot); else boot((hot&&hot.data)||{});
})();
</script>
